<div class="new-feed-page">
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple" [fullScreen]="true">
  </ngx-spinner>

  <div class="new-feed-page__content">
    <!-- Main Feed Section -->
    <div class="new-feed-page__main">
      <div class="new-feed-feed">
        <!-- Create Post Section -->
        <div class="create-post-card">
          <div class="create-post-header">
            <div class="create-post-avatar">
              <img [src]="userAvatar || 'assets/images/default-avatar.png'" alt="Your avatar">
            </div>
            <button class="create-post-trigger" (click)="openCreatePostModal()">
              <span class="create-post-placeholder">Share something...</span>
            </button>
          </div>
          <div class="create-post-actions">
            <button class="create-post-action" (click)="openCreatePostModal()">
              <i class="bi bi-image"></i>
              <span>Photo</span>
            </button>
            <button class="create-post-action" (click)="openCreatePostModal()">
              <i class="bi bi-file-earmark-text"></i>
              <span>Post</span>
            </button>
          </div>
        </div>

        <div class="new-feed-feed__list">
          <!-- Post Card -->
          <article class="card card-post" *ngFor="let post of listPost; let i = index">
            <!-- Post Header -->
            <div class="card-header">
              <div class="post-avatar-group" (click)="goToGroup(post)">
                <img class="post-group-image" [src]="post.group.image" alt="">
                <img class="post-author-avatar" [src]="post.avatar" alt="">
              </div>
              <div class="post-info">
                <h3 class="post-author" (click)="goToGroup(post)">{{post.group.nameEn}}</h3>
                <p class="post-time">
                  <strong>{{post.fullname}}</strong> · {{post.createdDate | date:'HH:mm dd/MM/YYYY'}}
                </p>
              </div>
              <div class="post-actions">
                <button *ngIf="post.author == userId" class="post-action-btn" (click)="updatePost(post, i)" aria-label="Edit post">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button *ngIf="post.author == userId" class="post-action-btn" (click)="deletePost(post._id, i)" aria-label="Delete post">
                  <i class="bi bi-trash3"></i>
                </button>
                <button *ngIf="post.author != userId" class="post-action-btn" (click)="report('post', post._id)" aria-label="Report post">
                  <i class="bi bi-flag"></i>
                </button>
              </div>
            </div>

            <!-- Post Content -->
            <div class="card-body">
              <div class="post-content" [innerHtml]="post?.content|safeHtml"></div>
            </div>

            <!-- Post Footer -->
            <div class="card-footer">
              <app-comment class="post-comments" [countCmt]="post?.countCmt" [postId]="post._id"></app-comment>
            </div>
          </article>

          <!-- Empty State -->
          <div class="new-feed-feed__empty" *ngIf="!listPost?.length">
            <div class="empty-state-content">
              <div class="empty-state-icon">
                <i class="bi bi-inbox"></i>
              </div>
              <h3 class="empty-state-title">No posts yet</h3>
              <p class="empty-state-text">{{'TITLE.NO_DATA'|translate}}</p>
            </div>
          </div>

          <!-- Load More -->
          <div class="new-feed-feed__pagination" *ngIf="page!=maxPage">
            <button class="btn-load-more" (click)="goToPage()">
              <span>{{'BUTTON.LOAD_MORE'|translate}}</span>
              <i class="bi bi-chevron-down"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Section -->
    <aside class="new-feed-page__sidebar">
      <div class="recruitment-news-slider">
        <div class="sidebar-header">
          <h3 class="sidebar-title">
            <i class="bi bi-briefcase"></i>
            Recruitment News
          </h3>
          <div class="sidebar-nav">
            <button class="sidebar-nav-btn" (click)="preNews()" aria-label="Previous news">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="sidebar-nav-btn" (click)="nextNews()" aria-label="Next news">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="recruitment-news-slider__list">
          <article class="recruitment-card" *ngFor="let news of listPostRecruitment" (click)="readNewsDetail(news)">
            <div class="recruitment-card__image">
              <img [src]="news.poster" alt="">
              <div class="recruitment-card__overlay">
                <span class="recruitment-badge">New</span>
              </div>
            </div>
            <div class="recruitment-card__content">
              <h4 class="recruitment-card__title">{{news?.title}}</h4>
              <p class="recruitment-card__company">{{news?.fullname}}</p>
              <div class="recruitment-card__meta">
                <span class="meta-item">
                  <i class="bi bi-currency-dollar"></i>
                  {{news?.salary}}
                </span>
                <span class="meta-item">
                  <i class="bi bi-geo-alt-fill"></i>
                  {{news?.location}}
                </span>
              </div>
            </div>
          </article>
        </div>
      </div>
    </aside>

    <!-- Mobile Horizontal News Ticker -->
    <div class="mobile-news-ticker">
      <div class="ticker-header">
        <h3 class="ticker-title">
          <i class="bi bi-briefcase"></i>
          Recruitment News
        </h3>
      </div>
      <div class="ticker-scroll">
        <article class="ticker-card" *ngFor="let news of listPostRecruitment" (click)="readNewsDetail(news)">
          <div class="ticker-card__image">
            <img [src]="news.poster" alt="">
          </div>
          <div class="ticker-card__content">
            <h4 class="ticker-card__title">{{news?.title}}</h4>
            <p class="ticker-card__salary">
              <i class="bi bi-currency-dollar"></i>
              {{news?.salary}}
            </p>
          </div>
        </article>
      </div>
    </div>

    <!-- Floating Action Button for Mobile -->
    <button class="fab-create-post" (click)="openCreatePostModal()" aria-label="Create new post">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>
</div>
