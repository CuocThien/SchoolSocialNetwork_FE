<div class="faculty-page">
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="ball-scale-multiple" [fullScreen]="true">
  </ngx-spinner>

  <div class="faculty-page__header">
    <h1 class="faculty-page__title">{{'TITLE.FACULTY'|translate}}</h1>
    <button class="btn btn-primary faculty-page__create-btn" (click)="createFaculty()">
      <i class="bi bi-plus-square"></i>
      <span>{{'BUTTON.CREATE_FACULTY'|translate}}</span>
    </button>
  </div>

  <div class="faculty-page__content">
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>Id</th>
            <th>{{'TABLE.NAMEEN'|translate}}</th>
            <th>{{'TABLE.NAMEVI'|translate}}</th>
            <th>{{'TABLE.NAME'|translate}}</th>
            <th class="text-center">{{'TABLE.ACTION'|translate}}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let faculty of listFaculty; let i = index">
            <td><code>{{faculty._id}}</code></td>
            <td>{{faculty.nameEn}}</td>
            <td>{{faculty.nameVi}}</td>
            <td>{{faculty?.profile?.fullname || '-'}}</td>
            <td class="text-center">
              <button class="btn-icon btn-icon--primary" (click)="editFaculty(faculty,i)" attr.aria-label="{{'BUTTON.EDIT'|translate}}">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn-icon btn-icon--secondary" (click)="tranferDean(faculty,i)" attr.aria-label="{{'BUTTON.TRANSFER'|translate}}">
                <i class="bi bi-arrow-left-right"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!listFaculty?.length">
            <td colspan="5" class="text-center">
              <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <p>{{'TITLE.NO_DATA'|translate}}</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
