<header class="app-header">
  <div class="app-header__container">
    <!-- Left Section - Search -->
    <div class="app-header__left">
      <form class="app-header__search" (ngSubmit)="onSubmit()">
        <div class="app-header__search-wrapper">
          <i class="bi bi-search app-header__search-icon"></i>
          <input
            class="app-header__search-input"
            type="text"
            name="search"
            [(ngModel)]="searchString"
            placeholder="{{'SEARCH.SEARCH_INFOR'|translate}}"
          >
        </div>
        <button class="app-header__search-btn" type="submit" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>
      </form>
    </div>

    <!-- Right Section - Actions -->
    <div class="app-header__right">
      <!-- Language Selector -->
      <div class="app-header__lang">
        <div class="dropdown">
          <button
            class="app-header__lang-btn dropdown-toggle"
            type="button"
            id="dropdownLanguages"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {{lang|translate}}
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownLanguages">
            <li>
              <button class="dropdown-item" (click)="selectLang('en')">
                {{'HEADER.ENGLISH' | translate}}
              </button>
            </li>
            <li>
              <button class="dropdown-item" (click)="selectLang('vi')">
                {{'HEADER.VIETNAMESE'|translate}}
              </button>
            </li>
          </ul>
        </div>
      </div>

      <!-- Chat -->
      <div class="app-header__action">
        <a
          class="app-header__action-btn"
          [routerLink]="['chat']"
          (click)="readChat()"
          aria-label="Chat"
        >
          <i class="bi bi-chat-dots"></i>
          <span *ngIf="isRecievedMessage" class="app-header__badge"></span>
        </a>
      </div>

      <!-- Notifications -->
      <div class="app-header__action">
        <input
          class="app-header__notif-cb"
          type="checkbox"
          [checked]="isCheck"
          id="btn_notification"
        >
        <label for="btn_notification" class="app-header__action-btn" aria-label="Notifications">
          <i class="bi bi-bell-fill"></i>
          <span *ngIf="listNotification[0]?.countRead" class="app-header__badge">
            {{listNotification[0]?.countRead}}
          </span>
        </label>

        <!-- Notification Dropdown -->
        <ul
          class="app-header__notif-dropdown"
          #chatBoxContent
          infiniteScroll
          [infiniteScrollDistance]="scrollDistance"
          [infiniteScrollUpDistance]="scrollUpDistance"
          [infiniteScrollThrottle]="throttle"
          [scrollWindow]="false"
          (scrolled)="onEnd($event)"
        >
          <li class="app-header__notif-header">
            <h3>{{'TITLE.NOTIFICATION'|translate}}</h3>
            <button class="app-header__notif-read-all" (click)="readAllNotification()">
              {{'TITLE.READ_ALL'|translate}}
            </button>
          </li>
          <li
            *ngFor="let notification of listNotification; let i = index"
            class="app-header__notif-item"
            [class.app-header__notif-item--unread]="!notification.isRead"
            (click)="readNotification(notification.notifyId, i);openNoti($event)"
          >
            <div class="app-header__notif-avatar">
              <img [src]="notification.avatar" alt="">
            </div>
            <div
              class="app-header__notif-content"
              [innerText]="isLangEn ? notification.contentEn : notification.contentVi"
            ></div>
          </li>
        </ul>
      </div>

      <!-- User Menu -->
      <div class="app-header__user">
        <div class="dropdown">
          <button
            class="app-header__user-btn dropdown-toggle"
            type="button"
            id="userDropdown"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img class="app-header__user-avatar" [src]="profile?.avatar" alt="">
            <span class="app-header__user-name d-none d-md-block">{{profile?.fullname}}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" [routerLink]="['profile']">
                <i class="bi bi-person"></i>
                {{'HEADER.PROFILE' | translate}}
              </a>
            </li>
            <li>
              <a class="dropdown-item" [routerLink]="['change-password']">
                <i class="bi bi-key"></i>
                {{'HEADER.CHANGE_PASSWORD' | translate}}
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i>
                {{'HEADER.LOG_OUT'|translate}}
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>
